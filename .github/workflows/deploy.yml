name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Validar data/projects.json
        run: python3 -m json.tool data/projects.json > /dev/null

      - name: Montar a pasta do site
        run: |
          mkdir _site
          cp -r index.html assets data _site/
          if [ -f cv/curriculo-lucca-oliveira-silva.pdf ]; then mkdir -p _site/cv && cp cv/curriculo-lucca-oliveira-silva.pdf _site/cv/; fi

      - name: Configurar o Pages
        uses: actions/configure-pages@v5

      - name: Enviar o site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publicar
        id: deploy
        uses: actions/deploy-pages@v4
