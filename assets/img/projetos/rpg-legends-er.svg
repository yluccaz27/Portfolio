<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 914" width="360" height="914" role="img" aria-labelledby="t d">
  <title id="t">Modelo do banco do RPG Legends</title>
  <desc id="d">User tem um Character (1:1). Character tem vários Equipment (1:N) e um BaseBuilding (1:1).</desc>
  <style>
    text { font-family: "Alegreya Sans", "Segoe UI", system-ui, sans-serif; font-size: 15px; fill: #E6DCC8; }
    .ent { font-size: 18px; font-weight: 700; fill: #B8964E; }
    .chave { fill: #5E8C7E; font-weight: 700; }
    .rel { font-size: 14px; fill: #B9AE9C; }
    .caixa { fill: #1E1414; stroke: #5A4540; stroke-width: 1; }
    .cab { fill: #271A19; }
    .linha { stroke: #8C8073; stroke-width: 1.25; fill: none; }
  </style>
  <rect width="360" height="914" fill="#1E1414"/>

  <!-- User -->
  <rect class="caixa" x="40.5" y="20.5" width="300" height="130"/>
  <rect class="cab" x="41" y="21" width="299" height="33"/>
  <text class="ent" x="56" y="44">User</text>
  <text x="56" y="76"><tspan class="chave">PK</tspan>  id</text>
  <text x="56" y="98">username</text>
  <text x="56" y="120">password_hash</text>
  <text x="56" y="142">created_at</text>

  <!-- User 1:1 Character -->
  <path class="linha" d="M190 151 V180"/>
  <text class="rel" x="200" y="171">1 : 1  possui</text>

  <!-- Character -->
  <rect class="caixa" x="40.5" y="180.5" width="300" height="218"/>
  <rect class="cab" x="41" y="181" width="299" height="33"/>
  <text class="ent" x="56" y="204">Character</text>
  <text x="56" y="236"><tspan class="chave">PK</tspan>  id</text>
  <text x="56" y="258"><tspan class="chave">FK</tspan>  user_id (único)</text>
  <text x="56" y="280">nome, classe</text>
  <text x="56" y="302">nivel, xp</text>
  <text x="56" y="324">moedas, poeira_arcana, pocoes</text>
  <text x="56" y="346">forca, destreza, vitalidade, mente</text>
  <text x="56" y="368">andar_masmorra, regiao_atual</text>
  <text x="56" y="390" class="rel">+ 6 campos: vida, ataque, defesa e treino</text>

  <!-- Character 1:N Equipment -->
  <path class="linha" d="M190 399 V450"/>
  <path class="linha" d="M180 440 L190 450 L200 440"/>
  <text class="rel" x="200" y="428">1 : N  carrega</text>

  <!-- Equipment -->
  <rect class="caixa" x="40.5" y="450.5" width="300" height="218"/>
  <rect class="cab" x="41" y="451" width="299" height="33"/>
  <text class="ent" x="56" y="474">Equipment</text>
  <text x="56" y="506"><tspan class="chave">PK</tspan>  id</text>
  <text x="56" y="528"><tspan class="chave">FK</tspan>  character_id</text>
  <text x="56" y="550">nome, tipo</text>
  <text x="56" y="572">raridade</text>
  <text x="56" y="594">bonus_ataque, bonus_defesa</text>
  <text x="56" y="616">bonus_hp, bonus_critico, bonus_esquiva</text>
  <text x="56" y="638">nivel_upgrade</text>
  <text x="56" y="660">equipado</text>

  <!-- Character 1:1 BaseBuilding (pela esquerda) -->
  <path class="linha" d="M40 290 H18 V800 H40"/>
  <text class="rel" x="56" y="708">1 : 1  constrói (a partir de Character)</text>

  <!-- BaseBuilding -->
  <rect class="caixa" x="40.5" y="720.5" width="300" height="174"/>
  <rect class="cab" x="41" y="721" width="299" height="33"/>
  <text class="ent" x="56" y="744">BaseBuilding</text>
  <text x="56" y="776"><tspan class="chave">PK</tspan>  id</text>
  <text x="56" y="798"><tspan class="chave">FK</tspan>  character_id (único)</text>
  <text x="56" y="820">nivel_mina, nivel_lab</text>
  <text x="56" y="842">ultima_coleta</text>
  <text x="56" y="864">moedas_acumuladas</text>
  <text x="56" y="886">pocoes_acumuladas</text>
</svg>
